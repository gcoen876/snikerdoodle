<!DOCTYPE html>
<html>
<body>
    <button id="autoBtn">Auto Get Token & Test API</button>
    <pre id="output"></pre>

    <script>
        const log = (msg) => {
            document.getElementById("output").innerText += msg + "\n";
        };

        document.getElementById("autoBtn").onclick = () => {
            log("Step 1: Opening app.base44.com to access its localStorage...");
            
            const popup = window.open("https://app.base44.com", "TokenPopup", "width=500,height=500");
            let tokenExtracted = false;
            
            // Poll popup's localStorage
            const interval = setInterval(() => {
                if (!popup || popup.closed) {
                    clearInterval(interval);
                    if (!tokenExtracted) log("❌ Popup closed without token");
                    return;
                }
                
                try {
                    // Access the popup's localStorage directly
                    const token = popup.localStorage.getItem("base44_access_token");
                    if (token && !tokenExtracted) {
                        tokenExtracted = true;
                        clearInterval(interval);
                        log("✅ Token extracted from popup: " + token.substring(0,30) + "...");
                        log("Step 2: Waiting 2 seconds before API call...");
                        
                        setTimeout(async () => {
                            try {
                                const res = await fetch("https://app.base44.com/api/auth/me", {
                                    headers: { "Authorization": `Bearer ${token}` },
                                    credentials: "include"
                                });
                                const text = await res.text();
                                log("✅ Status: " + res.status);
                                log("Response: " + text.substring(0, 200));
                                popup.close();
                            } catch(err) {
                                log("❌ CORS Error: " + err.message);
                                popup.close();
                            }
                        }, 2000);
                    }
                } catch(e) {
                    // Cross-origin error - can't access popup's localStorage
                    if (e.message.includes("SecurityError") || e.message.includes("cross-origin")) {
                        clearInterval(interval);
                        log("❌ Cannot access popup's localStorage due to same-origin policy");
                        log("Alternative: Use the postMessage method below");
                        popup.close();
                    }
                }
            }, 500);
            
            // Auto-close after 10 seconds
            setTimeout(() => {
                if (popup && !popup.closed && !tokenExtracted) {
                    clearInterval(interval);
                    log("Timeout - closing popup");
                    popup.close();
                }
            }, 10000);
        };
    </script>
</body>
</html>
