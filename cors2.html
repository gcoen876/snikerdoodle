<!DOCTYPE html>
<html>
<body>
    <button id="autoBtn">Auto Get Token & Test API</button>
    <pre id="output"></pre>

    <script>
        const log = (msg) => {
            document.getElementById("output").innerText += msg + "\n";
        };

        document.getElementById("autoBtn").onclick = async () => {
            log("Step 1: Opening app.base44.com to access localStorage...");
            
            const popup = window.open("https://app.base44.com", "TokenPopup", "width=500,height=500");
            let tokenReceived = false;
            
            // Wait for popup to load and extract token
            const extractToken = () => {
                try {
                    // Try to access localStorage directly (works if same origin)
                    const token = localStorage.getItem("base44_access_token");
                    if (token) {
                        log("✅ Token found in localStorage!");
                        return token;
                    }
                } catch(e) {
                    log("Direct access failed: " + e.message);
                }
                return null;
            };
            
            // Try direct access first
            setTimeout(() => {
                const token = extractToken();
                if (token) {
                    tokenReceived = true;
                    log("Step 2: Token extracted: " + token.substring(0,30) + "...");
                    log("Step 3: Making API request with 2 second delay...");
                    
                    setTimeout(async () => {
                        try {
                            const res = await fetch("https://app.base44.com/api/auth/me", {
                                headers: { "Authorization": `Bearer ${token}` },
                                credentials: "include"
                            });
                            const text = await res.text();
                            log("✅ Status: " + res.status);
                            log("Response: " + text.substring(0, 200));
                            if (popup && !popup.closed) popup.close();
                        } catch(err) {
                            log("❌ CORS Error: " + err.message);
                            if (popup && !popup.closed) popup.close();
                        }
                    }, 2000);
                } else {
                    log("❌ No token found. Make sure you're logged into app.base44.com");
                    if (popup && !popup.closed) popup.close();
                }
            }, 1500);
            
            // Auto-close popup after 5 seconds if no token
            setTimeout(() => {
                if (!tokenReceived && popup && !popup.closed) {
                    log("Closing popup - no token detected");
                    popup.close();
                }
            }, 5000);
        };
    </script>
</body>
</html>
