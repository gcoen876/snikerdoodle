<!DOCTYPE html>
<html>
<body>
    <button id="autoBtn">Auto Get Token & Test API</button>
    <pre id="output"></pre>

    <script>
        const log = (msg) => {
            document.getElementById("output").innerText += msg + "\n";
        };

        document.getElementById("autoBtn").onclick = async () => {
            log("Opening app.base44.com...");
            
            const popup = window.open("https://app.base44.com", "TokenPopup", "width=500,height=500");
            
            if (!popup) {
                log("❌ Popup blocked");
                return;
            }
            
            // Wait for popup to load then access its localStorage
            let attempts = 0;
            const maxAttempts = 20;
            
            const interval = setInterval(() => {
                attempts++;
                
                try {
                    // Try to access popup's localStorage
                    const token = popup.localStorage.getItem("base44_access_token");
                    
                    if (token) {
                        clearInterval(interval);
                        log("✅ Token found: " + token.substring(0,30) + "...");
                        log("Closing popup and making API request...");
                        popup.close();
                        
                        // Add delay before API request
                        setTimeout(async () => {
                            try {
                                const res = await fetch("https://app.base44.com/api/auth/me", {
                                    headers: { "Authorization": `Bearer ${token}` },
                                    credentials: "include"
                                });
                                const text = await res.text();
                                log("✅ Status: " + res.status);
                                log("Response: " + text.substring(0, 200));
                            } catch(err) {
                                log("❌ Error: " + err.message);
                            }
                        }, 1000);
                    } else if (attempts >= maxAttempts) {
                        clearInterval(interval);
                        log("❌ Timeout - no token found");
                        popup.close();
                    }
                } catch(e) {
                    // Cross-origin error - this will happen if different origins
                    if (attempts >= maxAttempts) {
                        clearInterval(interval);
                        log("❌ Cannot access localStorage - cross-origin blocked");
                        log("This only works if this page is on https://app.base44.com");
                        popup.close();
                    }
                }
            }, 500);
        };
    </script>
</body>
</html>
