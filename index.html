<!DOCTYPE html>
<html>
<head>
  <title>Cloud Notes (GitHub Gist)</title>
</head>
<body>

<h1>Cloud Notes (GitHub Storage)</h1>

<input id="noteInput" placeholder="Enter note" style="width:300px;" />
<button onclick="addNote()">Add Note</button>

<h2>Your Notes</h2>
<ul id="notesList"></ul>

<script>
  const GIST_ID = "00cc958d703860798be2f3b1d8abf959";
  const API_TOKEN = "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"; 

  async function fetchNotes() {
    const res = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
      headers: {
        "Authorization": "token " + API_TOKEN
      }
    });

    const gist = await res.json();
    const content = gist.files["notes.json"].content;

    try {
      return JSON.parse(content).notes || [];
    } catch {
      return [];
    }
  }

  async function saveNotes(notes) {
    const fileContent = JSON.stringify({ notes }, null, 2);

    await fetch(`https://api.github.com/gists/${GIST_ID}`, {
      method: "PATCH",
      headers: {
        "Authorization": "token " + API_TOKEN,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        files: {
          "notes.json": {
            content: fileContent
          }
        }
      })
    });
  }

  async function addNote() {
    const input = document.getElementById("noteInput");
    const text = input.value.trim();
    if (!text) return;

    const notes = await fetchNotes();
    notes.push(text);

    await saveNotes(notes);
    input.value = "";
    renderNotes();
  }

  async function renderNotes() {
    const notes = await fetchNotes();
    const list = document.getElementById("notesList");
    list.innerHTML = "";

    notes.forEach(n => {
      const li = document.createElement("li");
      li.textContent = n;
      list.appendChild(li);
    });
  }

  renderNotes();
</script>

</body>
</html>
