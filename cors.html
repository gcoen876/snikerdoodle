<!DOCTYPE html>
<html>
<body>
    <h3>CORS Token Test</h3>
    <input type="text" id="tokenInput" placeholder="Paste token here" size="50">
    <button id="test">Test API</button>
    <pre id="output"></pre>

    <script>
        document.getElementById("test").onclick = async () => {
            const token = document.getElementById("tokenInput").value;
            if (!token) {
                document.getElementById("output").innerText = "Please paste token first";
                return;
            }
            
            try {
                const res = await fetch("https://app.base44.com/api/auth/me", {
                    headers: { "Authorization": `Bearer ${token}` },
                    credentials: "include"
                });
                const text = await res.text();
                document.getElementById("output").innerText = `Status: ${res.status}\nResponse: ${text}`;
            } catch(err) {
                document.getElementById("output").innerText = "Error: " + err.message;
            }
        };
    </script>
</body>
</html>
